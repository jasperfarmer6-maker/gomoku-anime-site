<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="棋境是一款简洁、安静的在线五子棋小游戏。执黑先行，挑战中等难度 AI。"
    />
    <meta name="theme-color" content="#f7f5ef" />
    <link rel="canonical" href="https://lulisslce.cc.cd/" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="zh_CN" />
    <meta property="og:title" content="棋境｜在线五子棋" />
    <meta
      property="og:description"
      content="一个轻盈、专注的在线五子棋对局。"
    />
    <meta property="og:url" content="https://lulisslce.cc.cd/" />
    <title>棋境｜在线五子棋</title>
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
    <script type="module" src="/js/app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#game">跳到棋盘</a>

    <div class="page-shell">
      <header class="topbar">
        <a class="brand" href="/" aria-label="棋境首页">
          <span class="brand-mark" aria-hidden="true"></span>
          <span>棋境</span>
        </a>

        <div class="topbar-actions">
          <button
            class="quiet-button audio-button"
            id="audio-button"
            type="button"
            aria-pressed="true"
          >
            <span class="audio-icon" aria-hidden="true">♪</span>
            <span class="audio-label">音效开启</span>
          </button>
          <button class="primary-button" id="restart-button" type="button">
            重新开局
          </button>
        </div>
      </header>

      <main>
        <section class="intro" aria-labelledby="page-title">
          <p class="eyebrow">GOMOKU · 15 × 15</p>
          <h1 id="page-title">留一点空白，<br />看清下一步。</h1>
          <p class="intro-copy">
            你执黑先行。横、竖或斜线率先连成五颗棋子即可获胜。
          </p>
        </section>

        <section class="game-layout" id="game" aria-label="五子棋游戏">
          <div class="board-panel">
            <div class="status-bar" aria-live="polite">
              <div>
                <span class="status-dot" data-state="ready"></span>
                <strong id="game-status">轮到你了 · 黑子</strong>
              </div>
              <span>中等难度</span>
            </div>

            <div class="board-frame">
              <div
                class="game-board"
                id="board"
                role="grid"
                aria-label="十五乘十五五子棋盘。使用方向键移动，回车键落子。"
              ></div>
            </div>

            <div class="board-help">
              <span><i class="stone-key black"></i> 你</span>
              <span><i class="stone-key white"></i> AI</span>
              <span class="keyboard-hint">方向键移动 · ENTER 落子</span>
            </div>
          </div>

          <aside class="info-panel" aria-label="游戏信息">
            <div class="info-block">
              <p class="section-label">本地战绩</p>
              <div class="stats-grid">
                <div>
                  <strong id="wins">0</strong>
                  <span>胜</span>
                </div>
                <div>
                  <strong id="losses">0</strong>
                  <span>负</span>
                </div>
                <div>
                  <strong id="draws">0</strong>
                  <span>和</span>
                </div>
              </div>
            </div>

            <div class="info-block rule-block">
              <p class="section-label">规则</p>
              <ol>
                <li><span>1</span>点击交叉点落下黑子</li>
                <li><span>2</span>双方轮流落子</li>
                <li><span>3</span>率先连成五颗获胜</li>
              </ol>
            </div>

            <div class="privacy-note">
              战绩仅保存在当前浏览器，不会上传。
            </div>
          </aside>
        </section>
      </main>

      <footer>
        <span>棋境 © 2026</span>
        <span>无需登录 · 专注对弈</span>
      </footer>
    </div>

    <dialog class="result-overlay" id="result-overlay">
      <div class="result-card">
        <p class="section-label">本局结果</p>
        <h2 id="result-title">你赢了</h2>
        <p id="result-copy">五颗黑子连成一线。</p>
        <button class="primary-button large" id="result-button" type="button">
          再来一局
        </button>
      </div>
    </dialog>
  </body>
</html>
